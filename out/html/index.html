        <div class="overlay_top">
            <table>
                <tr>
                    <td>
                        <label for="backgrounds_yes">开启背景</label>
                    </td>
                    <td>
                        <input type="radio" id="backgrounds_yes" name="backgrounds" value="1" onclick="window.enableBg();">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="backgrounds_no">关闭背景</label>
                    </td>
                    <td>

                    </td>
                </tr>
                <tr>
                    <td> <hr> </td>
                </tr>
                <tr>
                    <td>
                        <label for="animate_yes">开启动画</label>
                    </td>

                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="animate_no">关闭动画</label>
                    </td>
                    <td>
                        <input type="radio" id="animate_no" name="animate" value="0" onclick="window.disableAnimate();">
                    </td>
                </tr>
                <tr>
                    <td> <hr> </td>
                </tr>
                <tr>
                    <td>
                        <label for="audio_yes">音乐开</label>
                    </td>
                    <td>
                        <input type="radio" id="audio_yes" name="audio" value="1" onclick="window.enableAudio();">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="audio_no">音乐关</label>
                    </td>
                    <td>
                        <input type="radio" id="audio_no" name="audio" value="0" onclick="window.disableAudio();">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="dark_mode_yes">开启深色模式</label>
                    </td>
                    <td>
                        <input type="radio" id="dark_mode_yes" name="dark_mode" value="1" onclick="window.enableDarkmode();">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="dark_mode_no">关闭深色模式</label>
                    </td>
                    <td>
                        <input type="radio" id="dark_mode_no" name="dark_mode" value="0" onclick="window.disableDarkmode();">
                    </td>
                </tr>

                <tr>
                    <td>
                        <button onclick="window.hideOptions();">关闭</button>
                    </td>
                </tr>
            </table>
        </div>
