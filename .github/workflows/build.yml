name: 构建并发布中文站

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'template-zh/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-zh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install
      # 对照门禁需要英文原版。必须**钉在同一次翻译所依据的版本**上:
      # upstream 仍在持续加内容,若跟随 main,原文一变对照门禁就必然报「实体缺失」,
      # 那是「上游新写了段」而不是「我们漏译了」—— 门禁会失去意义。
      # 升级原文基准时:改这里的 ref,然后按 .docs 流程补译新增段落。
      - name: 拉取英文原版(供对照门禁使用,钉在翻译基准版本)
        uses: actions/checkout@v4
        with:
          repository: CuttleCraft/social_democracy_redux
          ref: 0a378e2863bc0f39b4f5d048c2d2343706add16a
          path: .upstream
      - name: 构建
        run: |
          export EN_ROOT="$PWD/.upstream/source/scenes"
          node scripts/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4